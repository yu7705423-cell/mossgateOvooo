# XcodeGen 的工程描述。Xcode 工程文件（.xcodeproj）不进仓库，CI 上现生成：
# 那份 pbxproj 几千行，改一个文件就动一片，看不出改了什么。
name: Eira
options:
  bundleIdPrefix: cn.eiraphone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Eira:
    type: application
    platform: iOS
    sources:
      - path: Sources/Eira
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Eira/Info.plist
      properties:
        CFBundleDisplayName: Eiraowo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # 不用 iOS 26 的液态玻璃：顶栏按钮、返回、分段选择器照网页版画，不套系统的玻璃圆底
        UIDesignRequiresCompatibility: true
        # 新版界面的标题宋体（Resources/EiraSerif-SemiBold.ttf，scripts/make-serif.py 由网页版的字体合成）
        UIAppFonts:
          - EiraSerif-SemiBold.ttf
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 将图片存到「照片」。
        UIBackgroundModes:
          - fetch
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - eira.bgpush.refresh
        NSMicrophoneUsageDescription: 录制发送给角色的语音消息。
        NSCameraUsageDescription: 视频通话时显示你这边的画面；识图交给聊天模型时，画面随你说的话一起发给角色。
        NSSpeechRecognitionUsageDescription: 录音时用系统识别把语音消息转成文字。
    settings:
      base:
        # 正式的包标识，在开发者网站登记过、App Store Connect 里建 App 时选的就是它。一经使用永不改：
        # 改了就是另一只 app，装着的人要重装，手机里的数据带不过去
        PRODUCT_BUNDLE_IDENTIFIER: cn.eiraphone.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  EiraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      # 整个目录原样拷进测试包，测试里按 Fixtures/<文件名> 取
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Eira
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cn.eiraphone.native.tests
schemes:
  Eira:
    build:
      targets:
        Eira: all
        EiraTests: [test]
    test:
      config: Debug
      targets:
        - EiraTests
