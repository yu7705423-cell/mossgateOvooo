# XcodeGen 的工程描述。Xcode 工程文件（.xcodeproj）不进仓库，CI 上现生成：
# 那份 pbxproj 几千行，改一个文件就动一片，看不出改了什么。
name: Eira
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Eira:
    type: application
    platform: iOS
    sources:
      - path: Sources/Eira
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Eira/Info.plist
      properties:
        CFBundleDisplayName: Eiraowo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 将图片存到「照片」。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eiraowo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  EiraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      # 整个目录原样拷进测试包，测试里按 Fixtures/<文件名> 取
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Eira
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eiraowo.tests
schemes:
  Eira:
    build:
      targets:
        Eira: all
        EiraTests: [test]
    test:
      config: Debug
      targets:
        - EiraTests
