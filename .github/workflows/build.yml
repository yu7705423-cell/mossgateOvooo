name: 编译

# 推到 dev、main 自动跑，也可以手动触发。仓库是公开的，标准 macOS 机器不扣额度。
# 产物是未签名的 ipa，只用来确认代码能编过；签名与传 TestFlight 另写一份工作流。
on:
  workflow_dispatch:
  push:
    # wip/** 是几个助手各自在做的分支，推上来只为在苹果机器上编译、跑测试（本机是 Linux 编不了）
    branches: [dev, main, 'wip/**']

# 同一个分支连推几次，只编最新的那次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 选一个 Xcode
        # 挑装着的里头最新的那个，不写死路径：runner 镜像换代时默认的那个软链未必指向最新
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${NEWEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: 说明书是最新的
        # 界面上收起来的说明（HelpNote）由 scripts/gen-help.mjs 收进 Resources/help.json；改了说明没重跑就不往下编
        run: node scripts/gen-help.mjs --check

      - name: 取网页版的纯逻辑
        # 网页版仓库是私密的：网页版的代码不进本仓库（本仓库公开），只在编译时用只读钥匙取一份、打包进这次的 app，用完即删。
        # 没有钥匙（复刻的仓库）时跳过，相关测试也跳过
        env:
          WEB_REPO_TOKEN: ${{ secrets.WEB_REPO_TOKEN }}
        run: |
          if [ -z "$WEB_REPO_TOKEN" ]; then echo "没有 WEB_REPO_TOKEN，跳过"; exit 0; fi
          git clone -q --depth 1 --branch claude/mini-phone-architecture-tqzvig \
            "https://x-access-token:${WEB_REPO_TOKEN}@github.com/yu7705423-cell/phone.git" "$RUNNER_TEMP/web"
          # 网页版改了结构（合并、挪动文件）导致打包不出来时不拦这次编译：app 自动退回原生解析，这里只记一条警告
          if node scripts/sync-weblogic.mjs "$RUNNER_TEMP/web" reply && node scripts/check-weblogic.mjs reply; then
            echo "网页版逻辑已打包"
          else
            echo "::warning::网页版逻辑打包失败，这次的 app 用原生解析。看 scripts/sync-weblogic.mjs 的输出，按网页版的新结构调整"
            rm -f Resources/weblogic/reply.bundle.js
          fi
          # 提示词拼装（docs/jscore-prompt.md，试点，默认关）：同样不拦编译，打不出来时 app 里没有这一项，照旧原生拼装
          if node scripts/sync-weblogic.mjs "$RUNNER_TEMP/web" prompt && node scripts/check-weblogic.mjs prompt; then
            echo "网页版提示词拼装已打包"
          else
            echo "::warning::网页版提示词拼装打包失败，这次的 app 照旧原生拼装。看 scripts/sync-weblogic.mjs 与 check-weblogic.mjs 的输出"
            rm -f Resources/weblogic/prompt.bundle.js
          fi
          # 美化生成器（docs/jscore-skin.md）：编辑器的设置编成 CSS。打不出来时编辑器退回原生那几项，不拦编译
          if node scripts/sync-weblogic.mjs "$RUNNER_TEMP/web" skin && node scripts/check-weblogic.mjs skin; then
            echo "网页版美化生成器已打包"
          else
            echo "::warning::网页版美化生成器打包失败，这次的 app 里美化编辑器只有原生的几项。看 scripts/sync-weblogic.mjs 与 check-weblogic.mjs 的输出"
            rm -f Resources/weblogic/skin.bundle.js Tests/Fixtures/skingen-expected.json
          fi
          rm -rf "$RUNNER_TEMP/web"

      - name: 生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 自动测试
        # 在模拟器上跑 Tests/Unit：导入网页版备份、回复切分、提示词拼装、请求次数。
        # 任何一项不过，这次编译就算失败，不出 ipa
        run: |
          set -o pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in runtimes for x in d[k] if x["name"].startswith("iPhone")))
          ')"
          echo "模拟器 $UDID"
          # 导出测试把几份备份写到这里，下一步用网页版的代码读（xcodebuild 把 TEST_RUNNER_ 开头的变量交给测试）
          export TEST_RUNNER_EXPORT_CHECK_DIR="$RUNNER_TEMP/export-check"
          xcodebuild test \
            -project Eira.xcodeproj \
            -scheme Eira \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E 'error:|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|STRESS |\[weblogic\]' || true
          grep -q 'TEST SUCCEEDED' test.log

      - name: 网页版读得回导出的备份
        run: node scripts/check-export.mjs "$RUNNER_TEMP/export-check"

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild \
            -project Eira.xcodeproj \
            -scheme Eira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: 打成未签名的 ipa
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Eiraowo-unsigned.ipa Payload
          ls -l Eiraowo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Eiraowo-unsigned
          path: Eiraowo-unsigned.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: |
            build.log
            test.log
          retention-days: 7
