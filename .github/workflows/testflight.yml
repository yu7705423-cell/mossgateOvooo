name: 传 TestFlight

# 签好名传到 App Store Connect，处理完在 TestFlight 里出现。做法照网页版仓库的 ios-testflight.yml（ARCHITECTURE 4.548）：
# 证书与描述文件每次现申请，传完就撤（scripts/asc.py 里写了为什么），不用自己管。
#
# 什么时候跑：
#   - 推一个 tf- 开头的标签（例如 tf-0.1.0-1），传那个标签所在的那次提交。从 dev 发测试版不必动 main
#   - 推到 main
#   - 在 Actions 页面手动运行（这份文件在 main 上才有那个按钮）
# 要传的那次提交应当已经在「编译」那个工作流里过了全部测试：这里只打包上传，不再重跑测试。
#
# 仓库 Settings → Secrets and variables → Actions 里要有：
#   ASC_ISSUER_ID   App Store Connect → 用户和访问 → 集成 → App Store Connect API 页上的 Issuer ID
#   ASC_KEY_ID      那把密钥的 Key ID
#   ASC_KEY_P8      下载下来的 AuthKey_xxx.p8 的全文
#   APPLE_TEAM_ID   开发者账号的 Team ID
# 包标识写在 project.yml 里（cn.eiraphone.native），不另设变量。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['tf-*']

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: cn.eiraphone.native
      # 构建号要一次比一次大：用这个工作流跑了第几次
      BUILD_NUM: ${{ github.run_number }}
    steps:
      # 暂放目录不能写在上面 job 的 env 里：那里读不到 runner 这个上下文，整个文件会被判无效
      - name: 暂放目录
        run: echo "SIGN_DIR=$RUNNER_TEMP/sign" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: 检查机密
        run: |
          missing=""
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then echo "::error::还没放好：$missing"; exit 1; fi
          grep -q "PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID$" project.yml \
            || { echo "::error::project.yml 里的包标识不是 $BUNDLE_ID"; exit 1; }
          echo "包标识 $BUNDLE_ID，构建号 $BUILD_NUM"

      - name: 选一个 Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${NEWEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: 生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 申请证书与描述文件
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/asc.py prepare "$BUNDLE_ID" "$SIGN_DIR"

      - name: 放进临时钥匙串，装好描述文件
        id: keychain
        run: |
          KC="$RUNNER_TEMP/eira.keychain-db"
          PW="$(openssl rand -hex 16)"
          P12PW="$(openssl rand -hex 16)"
          /usr/bin/openssl x509 -inform DER -in "$SIGN_DIR/cert.cer" -out "$SIGN_DIR/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN_DIR/key.pem" -in "$SIGN_DIR/cert.pem" \
            -out "$SIGN_DIR/id.p12" -passout "pass:$P12PW"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          # 中间证书。签名要能连到 Apple 的根上
          curl -fsSL -o "$SIGN_DIR/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$SIGN_DIR/wwdr.cer" -k "$KC" -T /usr/bin/codesign >/dev/null || true
          security import "$SIGN_DIR/id.p12" -k "$KC" -P "$P12PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SHA="$(/usr/bin/openssl x509 -in "$SIGN_DIR/cert.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          security find-identity -v -p codesigning "$KC"
          # 描述文件放到 Xcode 认的两个地方（新旧版本各认一个），按 UUID 命名
          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/profile.plist")"
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"
            cp "$SIGN_DIR/profile.mobileprovision" "$D/$UUID.mobileprovision"
          done
          echo "描述文件 $UUID"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          echo "identity=$SHA" >> "$GITHUB_OUTPUT"
          echo "profile=$UUID" >> "$GITHUB_OUTPUT"

      - name: 打包（archive）
        env:
          KC: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          PROFILE: ${{ steps.keychain.outputs.profile }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Eira.xcodeproj \
            -scheme Eira \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Eira.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            | tee archive.log | grep -E 'error:|ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log

      - name: 导出签名的 ipa
        env:
          KC: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          PROFILE: ${{ steps.keychain.outputs.profile }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Eira.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee export.log | grep -E 'error:|EXPORT (SUCCEEDED|FAILED)' || true
          grep -q 'EXPORT SUCCEEDED' export.log
          ls -l "$RUNNER_TEMP/export"

      - name: 上传到 App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::已上传，构建号 $BUILD_NUM。App Store Connect 处理完（通常十几分钟到半小时）会出现在 TestFlight 里"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-log
          path: |
            archive.log
            export.log
          retention-days: 7

      - name: 收回证书与描述文件
        if: always()
        run: |
          [ -x "$RUNNER_TEMP/venv/bin/python" ] && "$RUNNER_TEMP/venv/bin/python" scripts/asc.py cleanup "$SIGN_DIR" || true
          security delete-keychain "$RUNNER_TEMP/eira.keychain-db" 2>/dev/null || true
          rm -rf "$SIGN_DIR" ~/.appstoreconnect
